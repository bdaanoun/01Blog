<header class="header">
  <div class="container">
    <div class="nav">
      <div class="logo" routerLink="/home">
        <img src="/assets/logo.svg" alt="logo">
      </div>

      <!-- Buttons when logged in -->
      <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
        <div class="nav-buttons" style="display: flex; align-items: center; gap: 12px;">
          <button class="btn btn-outline" routerLink="/writePost">Write Post</button>

          <!-- Notifications -->
          <div class="notifications-wrapper">
            <button class="notifications-btn" (click)="toggleNotifications()">
              <mat-icon>notifications</mat-icon>
              <span *ngIf="notifications.length > 0" class="badge">{{ notifications.length }}</span>
            </button>

            <!-- <div *ngIf="showNotifications" class="notifications-dropdown">
              <div *ngFor="let n of notifications" class="notifications-dropdown-item">{{ n.message }}</div>
              <div *ngIf="notifications.length === 0" class="notifications-dropdown-item">No notifications</div>
            </div> -->
            <div *ngIf="showNotifications" class="notifications-dropdown">

              <div *ngIf="loadingNotifications" class="notifications-dropdown-item">
                Loading...
              </div>
              <ng-container *ngIf="!loadingNotifications">
                <div *ngFor="let n of notifications" class="notifications-dropdown-item">
                  <strong>{{ n.senderUsername }}</strong> — {{ n.content }}
                  <div class="notif-date">{{ n.createdAt | date:'short' }}</div>
                </div>
                <div *ngIf="notifications.length === 0" class="notifications-dropdown-item">
                  No notifications
                </div>
              </ng-container>

            </div>

          </div>


          <div class="avatar-wrapper" (click)="toggleProfileDropdown()">
            <div class="userinfo">
              <div class="username"> {{ (currentUser$ | async)?.username }}</div>
              <div class="email"> {{ (currentUser$ | async)?.email }}</div>
            </div>
            <ng-container *ngIf="currentUser$ | async as user; else tokenInitial">

              <img *ngIf="user?.avatar; else userInitial" class="avatar avatar-img" [src]="getAvatarUrl(user.avatar)"
                alt="avatar" />
              <ng-template #userInitial>
                <div class="avatar avatar-initial">
                  {{ user?.username?.charAt(0)?.toUpperCase() || 'U' }}
                </div>
              </ng-template>

            </ng-container>

            <ng-template #tokenInitial>
              <div class="avatar avatar-initial">
                {{ getUserInitial() }}
              </div>
            </ng-template>

            <div *ngIf="showProfileDropdown" class="dropdown">
              <span class="dropdown-item btn btn-outline w-full text-left" (click)="goToMyProfile()">Profile</span>
              <span (click)="logout()" class="dropdown-item btn btn-outline w-full text-left">Logout</span>
            </div>
          </div>


        </div>
      </ng-container>

      <!-- Buttons when NOT logged in -->
      <ng-template #loggedOut>
        <div class="nav-buttons">
          <button class="btn btn-outline" routerLink="/login">Login</button>
          <button class="btn btn-outline" routerLink="/register">Register</button>
        </div>
      </ng-template>

    </div>
  </div>
</header>
