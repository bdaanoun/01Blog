<!-- report-dialog.component.html -->

<h2 mat-dialog-title>Report this post</h2>

<div mat-dialog-content class="report-content">
    <mat-form-field appearance="outline" class="full">
        <mat-label>Reason</mat-label>

        <input matInput [formControl]="reasonControl" placeholder="e.g. spam, harassment, misleading content..." />

        <mat-hint>10–200 characters</mat-hint>

        <mat-error *ngIf="reasonControl.hasError('required')">
            Reason is required
        </mat-error>

        <mat-error *ngIf="reasonControl.hasError('minlength')">
            Too short
        </mat-error>

        <mat-error *ngIf="reasonControl.hasError('maxlength')">
            Too long
        </mat-error>
    </mat-form-field>
</div>

<div mat-dialog-actions align="end" class="report-actions">
    <button mat-button type="button" (click)="close()">Cancel</button>

    <button mat-flat-button color="warn" type="button" (click)="submit()" [disabled]="reasonControl.invalid">
        Send report
    </button>
</div>
