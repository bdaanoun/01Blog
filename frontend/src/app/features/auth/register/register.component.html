<div class="register-container">

  <!-- Success Message -->
  <div class="alert alert-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <!-- Floating avatar upload (half outside) -->
  <div class="avatar-float">
    <label class="avatar-box">
      <input #avatarInput type="file" accept="image/*" (change)="onAvatarSelected($event)" hidden />

      <img *ngIf="avatarPreview" [src]="avatarPreview" class="avatar-img" alt="avatar" />

      <div *ngIf="!avatarPreview" class="avatar-placeholder">
        <mat-icon class="avatar-icon">photo_camera</mat-icon>
      </div>
    </label>
  </div>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="form-content">

    <div class="form-group">
      <label>Username *</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="user.username"
        [disabled]="isLoading"
        [class.invalid]="isFieldInvalid(user.username)"
        required
      />
      <span class="error" *ngIf="isFieldInvalid(user.username)">Username is required</span>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="user.email"
        [disabled]="isLoading"
        [class.invalid]="isFieldInvalid(user.email)"
        required
      />
      <span class="error" *ngIf="isFieldInvalid(user.email)">Email is required</span>
    </div>

    <div class="form-group">
      <label>Password *</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="user.password"
        (ngModelChange)="clearPasswordMismatch()"
        [disabled]="isLoading"
        [class.invalid]="isFieldInvalid(user.password)"
        required
      />
      <span class="error" *ngIf="isFieldInvalid(user.password)">Password is required</span>
    </div>

    <div class="form-group">
      <label>Confirm Password *</label>
      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="user.confirmPassword"
        (ngModelChange)="clearPasswordMismatch()"
        [disabled]="isLoading"
        [class.invalid]="isFieldInvalid(user.confirmPassword) || passwordMismatch"
        required
      />
      <span class="error" *ngIf="isFieldInvalid(user.confirmPassword)">Please confirm your password</span>
      <span class="error" *ngIf="passwordMismatch">Passwords do not match</span>
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea
        name="bio"
        [(ngModel)]="user.bio"
        [disabled]="isLoading"
        rows="4"
        maxlength="500"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading">Registering...</span>
      </button>

      <button type="button" class="btn-secondary" (click)="resetForm()" [disabled]="isLoading">
        Clear
      </button>
    </div>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>

  </form>
</div>
